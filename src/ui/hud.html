<!-- Project: Last Exotic — Phase 1 HUD Overlay (EXOTIC-006)
     Inject directly into index.html over #game-canvas and load src/ui/hud.css.
     Root & layout containers use pointer-events: none; interactive buttons/slots use pointer-events: auto. -->
<div id="hud-root" class="hud-root" role="region" aria-label="Game HUD">

  <!-- TOP-LEFT: 3-Node Circular Radial Action Wheel -->
  <nav id="hud-radial-wheel" class="hud-radial-cluster" aria-label="Action Wheel">
    <!-- Node 1: Monkey Commands (Top-Left) -->
    <button
      type="button"
      id="hud-action-monkey"
      class="hud-radial-btn hud-radial-btn--monkey"
      data-action="monkey-commands"
      data-hotkey="Q"
      aria-label="Monkey Commands (Q)"
      title="Monkey Commands (Q)"
    >
      <svg class="hud-radial-icon" viewBox="0 0 48 48" aria-hidden="true">
        <!-- Ears -->
        <circle cx="11" cy="24" r="6" fill="#8d552b" stroke="#181c20" stroke-width="2.6" />
        <circle cx="11.5" cy="24" r="3" fill="#e8b88a" />
        <circle cx="37" cy="24" r="6" fill="#8d552b" stroke="#181c20" stroke-width="2.6" />
        <circle cx="36.5" cy="24" r="3" fill="#e8b88a" />
        <!-- Head Fur -->
        <path d="M13 24c0-8 5-13 11-13 2.5-3 6-3 7-1-1 1.5-.5 2.5.5 3.5 2.5 2.5 3.5 6 3.5 10.5 0 7-4.5 12-11 12s-11-5-11-12z" fill="#8d552b" stroke="#181c20" stroke-width="2.6" stroke-linejoin="round" />
        <!-- Tan Face Mask -->
        <path d="M16 23c0-3.5 2.5-6 5.5-5.5 1.2.2 2 .9 2.5 1.7.5-.8 1.3-1.5 2.5-1.7 3-.5 5.5 2 5.5 5.5 0 2-1 3.5-2 4.5 1 1 1.5 2.2 1.5 3.5 0 3.2-3.4 5.5-7.5 5.5s-7.5-2.3-7.5-5.5c0-1.3.5-2.5 1.5-3.5-1-1-2-2.5-2-4.5z" fill="#e8b88a" stroke="#181c20" stroke-width="2" stroke-linejoin="round" />
        <!-- Eyes -->
        <circle cx="20.5" cy="23.5" r="2.1" fill="#181c20" />
        <circle cx="27.5" cy="23.5" r="2.1" fill="#181c20" />
        <circle cx="21.1" cy="22.8" r="0.7" fill="#ffffff" />
        <circle cx="28.1" cy="22.8" r="0.7" fill="#ffffff" />
        <!-- Nostrils & Smile -->
        <circle cx="22.7" cy="27.5" r="0.9" fill="#5c361a" />
        <circle cx="25.3" cy="27.5" r="0.9" fill="#5c361a" />
        <path d="M20.5 30.8c2 1.8 5 1.8 7 0" fill="none" stroke="#181c20" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span class="hud-key-badge hud-key-badge--left" aria-hidden="true">Q</span>
    </button>

    <!-- Node 2: Crafting Blueprints (Top-Right) -->
    <button
      type="button"
      id="hud-action-craft"
      class="hud-radial-btn hud-radial-btn--craft"
      data-action="crafting"
      data-hotkey="E"
      aria-label="Crafting Blueprints (E)"
      title="Crafting Blueprints (E)"
    >
      <svg class="hud-radial-icon" viewBox="0 0 48 48" aria-hidden="true">
        <!-- Blueprint Sheet -->
        <rect x="11" y="12" width="26" height="24" rx="3" fill="#2d6be4" stroke="#181c20" stroke-width="2.6" />
        <!-- Rolled Left Edge -->
        <path d="M11 14c0-2 2-3.5 4-3.5s3.5 1.5 3.5 3.5v20c0 2-1.5 3.5-3.5 3.5S11 36 11 34V14z" fill="#4f8cff" stroke="#181c20" stroke-width="2.4" />
        <ellipse cx="14.7" cy="14" rx="2" ry="1.4" fill="#1d4aa8" stroke="#181c20" stroke-width="1.6" />
        <!-- Blueprint Grid & Schematic Lines -->
        <path d="M21 18h12M21 24h12M21 30h8M25 16v16M31 16v10" fill="none" stroke="#dcebff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
        <rect x="23" y="20" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1.8" />
      </svg>
      <span class="hud-key-badge hud-key-badge--right" aria-hidden="true">E</span>
    </button>

    <!-- Node 3: Build / Repair Tools (Bottom-Center) -->
    <button
      type="button"
      id="hud-action-build"
      class="hud-radial-btn hud-radial-btn--build"
      data-action="build-repair"
      data-hotkey="R"
      aria-label="Build and Repair (R)"
      title="Build and Repair (R)"
    >
      <svg class="hud-radial-icon" viewBox="0 0 48 48" aria-hidden="true">
        <!-- Wrench (Back Diagonal) -->
        <g transform="rotate(-45 24 24)">
          <rect x="21.5" y="13" width="5" height="23" rx="2" fill="#9aa8b4" stroke="#181c20" stroke-width="2.4" />
          <path d="M18.5 12a6 6 0 0 1 11 0c0 2.5-1.5 4.5-3.5 5.2h-4c-2-.7-3.5-2.7-3.5-5.2zm3.5-1.5v3h4v-3" fill="#b8c6d1" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
        </g>
        <!-- Hammer (Front Diagonal) -->
        <g transform="rotate(45 24 24)">
          <rect x="21.6" y="16" width="4.8" height="21" rx="2" fill="#b8783e" stroke="#181c20" stroke-width="2.4" />
          <path d="M15 12h16c1.5 0 2.5 1.2 2.5 2.8v2.4c0 1.6-1 2.8-2.5 2.8H17c-1.8 0-3-1.5-3-3.5v-1c0-2 0-3.5 1-3.5z" fill="#6d7a85" stroke="#181c20" stroke-width="2.4" stroke-linejoin="round" />
        </g>
      </svg>
      <span class="hud-key-badge hud-key-badge--bottom" aria-hidden="true">R</span>
    </button>
  </nav>

  <!-- TOP-RIGHT: Circular Live Minimap with Compass & Sun Time Indicator -->
  <aside id="hud-minimap-container" class="hud-minimap-cluster" aria-label="Minimap">
    <div class="hud-minimap-frame">
      <canvas
        id="hud-minimap"
        class="hud-minimap-canvas"
        width="160"
        height="160"
        aria-label="Live Island Minimap"
      ></canvas>

      <!-- Cardinal Compass Markers -->
      <span class="hud-compass-mark hud-compass-mark--n" aria-hidden="true">N</span>
      <span class="hud-compass-mark hud-compass-mark--e" aria-hidden="true">E</span>
      <span class="hud-compass-mark hud-compass-mark--s" aria-hidden="true">S</span>
      <span class="hud-compass-mark hud-compass-mark--w" aria-hidden="true">W</span>

      <!-- Sun / Time-of-Day Badge on Upper-Right Rim -->
      <div id="hud-time-badge" class="hud-time-badge" data-time-of-day="day" aria-label="Daytime">
        <svg class="hud-time-icon" viewBox="0 0 36 36" aria-hidden="true">
          <!-- 8-Point Sun Rays -->
          <polygon
            points="18,2 21.5,9.5 29.5,6.5 26.5,14.5 34,18 26.5,21.5 29.5,29.5 21.5,26.5 18,34 14.5,26.5 6.5,29.5 9.5,21.5 2,18 9.5,14.5 6.5,6.5 14.5,9.5"
            fill="#ff8c1a"
            stroke="#181c20"
            stroke-width="2.2"
            stroke-linejoin="round"
          />
          <!-- Bright Sun Core -->
          <circle cx="18" cy="18" r="7.5" fill="#ffe135" stroke="#181c20" stroke-width="2" />
          <circle cx="15.8" cy="15.8" r="2.2" fill="#fff7b2" />
        </svg>
      </div>
    </div>
  </aside>

  <!-- BOTTOM-CENTER: HP Gauge + 10-Slot Hotbar + Tooltip + Stamina Gauge -->
  <section id="hud-bottom-dock" class="hud-bottom-dock" aria-label="Status and Hotbar">
    <!-- Left Flank: Circular Red Heart HP Gauge -->
    <div
      id="hud-hp-gauge"
      class="hud-gauge hud-gauge--hp"
      role="meter"
      aria-label="Health"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="100"
    >
      <div class="hud-gauge-cavity">
        <div class="hud-gauge-fill hud-gauge-fill--hp"></div>
        <svg class="hud-gauge-icon hud-gauge-icon--heart" viewBox="0 0 40 40" aria-hidden="true">
          <path
            d="M20 33.5C18.8 32.5 7 24.4 7 15.6 7 10.7 10.7 7 15.2 7c2.6 0 4.8 1.4 4.8 3.6C20 8.4 22.2 7 24.8 7 29.3 7 33 10.7 33 15.6c0 8.8-11.8 16.9-13 17.9z"
            fill="#ef2b2d"
            stroke="#181c20"
            stroke-width="2.8"
            stroke-linejoin="round"
          />
          <path
            d="M12.2 14.8c0-2.4 1.6-4.2 3.8-4.5"
            fill="none"
            stroke="#ff9e9e"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

    <!-- Center: Item Tooltip + 10-Slot Hotbar -->
    <div class="hud-hotbar-wrapper">
      <div class="hud-hotbar-header">
        <span class="hud-shoulder-badge" aria-hidden="true">LB</span>
        <div id="hud-item-tooltip" class="hud-item-tooltip" aria-live="polite">FLIMSY AXE</div>
        <span class="hud-shoulder-badge" aria-hidden="true">RB</span>
      </div>

      <div id="hud-hotbar" class="hud-hotbar" role="toolbar" aria-label="Item Hotbar">
        <!-- Slot 0: Cooked Meat -->
        <button type="button" class="hud-slot" data-slot="0" data-item-name="COOKED MEAT" aria-label="Slot 1: Cooked Meat" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">1</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M10 26l6-6" stroke="#f0e8d5" stroke-width="4" stroke-linecap="round" />
            <circle cx="8.5" cy="27.5" r="2.5" fill="#f0e8d5" stroke="#181c20" stroke-width="1.6" />
            <ellipse cx="21" cy="15" rx="8.5" ry="6.5" transform="rotate(-35 21 15)" fill="#b8382c" stroke="#181c20" stroke-width="2.2" />
            <ellipse cx="19.5" cy="13.5" rx="3.2" ry="1.8" transform="rotate(-35 19.5 13.5)" fill="#e86f5e" />
          </svg>
        </button>

        <!-- Slot 1: Wooden Club -->
        <button type="button" class="hud-slot" data-slot="1" data-item-name="WOODEN CLUB" aria-label="Slot 2: Wooden Club" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">2</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <g transform="rotate(42 18 18)">
              <rect x="15.5" y="12" width="5" height="17" rx="2" fill="#9c6230" stroke="#181c20" stroke-width="2.2" />
              <rect x="11" y="7" width="14" height="7" rx="2.5" fill="#7d4a21" stroke="#181c20" stroke-width="2.2" />
            </g>
          </svg>
          <span class="hud-slot-durability" style="--durability-pct: 88%" aria-hidden="true"></span>
        </button>

        <!-- Slot 2: Palm Leaf -->
        <button type="button" class="hud-slot" data-slot="2" data-item-name="PALM LEAF" aria-label="Slot 3: Palm Leaf" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">3</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M8 26C10 14 19 8 28 9c-1 10-7 17-18 18z" fill="#4fa642" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M9 26C15 20 21 15 27 10" fill="none" stroke="#9be063" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>

        <!-- Slot 3: Flimsy Hammer -->
        <button type="button" class="hud-slot" data-slot="3" data-item-name="FLIMSY HAMMER" aria-label="Slot 4: Flimsy Hammer" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">4</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <g transform="rotate(-40 18 18)">
              <rect x="16" y="13" width="4.2" height="16" rx="1.8" fill="#b8783e" stroke="#181c20" stroke-width="2" />
              <rect x="10.5" y="8" width="15" height="6.5" rx="2" fill="#7c8a96" stroke="#181c20" stroke-width="2.2" />
            </g>
          </svg>
          <span class="hud-slot-durability" style="--durability-pct: 72%" aria-hidden="true"></span>
        </button>

        <!-- Slot 4: Flimsy Pickaxe -->
        <button type="button" class="hud-slot" data-slot="4" data-item-name="FLIMSY PICKAXE" aria-label="Slot 5: Flimsy Pickaxe" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">5</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <g transform="rotate(-40 18 18)">
              <rect x="16" y="12" width="4" height="18" rx="1.6" fill="#b8783e" stroke="#181c20" stroke-width="2" />
              <path d="M8 13c4-4 16-4 20 0l-2.5 3c-3.5-2.5-11.5-2.5-15 0z" fill="#8896a3" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
            </g>
          </svg>
          <span class="hud-slot-durability" style="--durability-pct: 64%" aria-hidden="true"></span>
        </button>

        <!-- Slot 5: Rope Bundle -->
        <button type="button" class="hud-slot" data-slot="5" data-item-name="ROPE BUNDLE" aria-label="Slot 6: Rope Bundle" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">6</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <ellipse cx="18" cy="18" rx="9" ry="7" fill="none" stroke="#181c20" stroke-width="5.2" />
            <ellipse cx="18" cy="18" rx="9" ry="7" fill="none" stroke="#d4b06a" stroke-width="2.6" />
            <path d="M13 13l10 10M23 13L13 23" stroke="#b38c46" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="hud-slot-durability" style="--durability-pct: 95%" aria-hidden="true"></span>
        </button>

        <!-- Slot 6: Flimsy Axe (Active Selected Slot) -->
        <button type="button" class="hud-slot is-selected" data-slot="6" data-item-name="FLIMSY AXE" aria-label="Slot 7: Flimsy Axe (Selected)" aria-pressed="true">
          <span class="hud-slot-key" aria-hidden="true">7</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <g transform="rotate(-38 18 18)">
              <rect x="16" y="10" width="4.2" height="20" rx="1.8" fill="#b8783e" stroke="#181c20" stroke-width="2" />
              <path d="M19 9h7.5c2 2.2 2 6.8 0 9H19z" fill="#8b9aa6" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
              <path d="M24.2 10.5c1.2 1.8 1.2 5.2 0 7" fill="none" stroke="#dce6ee" stroke-width="1.6" stroke-linecap="round" />
            </g>
          </svg>
          <span class="hud-slot-durability" style="--durability-pct: 80%" aria-hidden="true"></span>
        </button>

        <!-- Slot 7: Flint Shard -->
        <button type="button" class="hud-slot" data-slot="7" data-item-name="FLINT SHARD" aria-label="Slot 8: Flint Shard" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">8</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <polygon points="10,25 14,12 24,10 27,21 19,27" fill="#4b545e" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
            <polygon points="14,12 24,10 20,18 13,18" fill="#6d7885" />
          </svg>
        </button>

        <!-- Slot 8: Machete -->
        <button type="button" class="hud-slot" data-slot="8" data-item-name="MACHETE" aria-label="Slot 9: Machete" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">9</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M10 26l4-4" stroke="#7d4a21" stroke-width="4.5" stroke-linecap="round" />
            <path d="M13 23L26 9c2 1.8 2 5.2-.5 8.5L16 25z" fill="#c7d4de" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
          </svg>
          <span class="hud-slot-durability" style="--durability-pct: 100%" aria-hidden="true"></span>
        </button>

        <!-- Slot 9: Island Acorn (Stack x2) -->
        <button type="button" class="hud-slot" data-slot="9" data-item-name="ISLAND ACORN" aria-label="Slot 10: Island Acorn, count 2" aria-pressed="false">
          <span class="hud-slot-key" aria-hidden="true">0</span>
          <svg class="hud-slot-icon" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M12 16c0 7 3.5 11 6 12 2.5-1 6-5 6-12z" fill="#d98934" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M10 16c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5z" fill="#7a4c25" stroke="#181c20" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M18 9.5V6.5" stroke="#181c20" stroke-width="2.4" stroke-linecap="round" />
          </svg>
          <span class="hud-slot-count" aria-hidden="true">2</span>
        </button>
      </div>
    </div>

    <!-- Right Flank: Circular Green Lightning Stamina Gauge -->
    <div
      id="hud-stamina-gauge"
      class="hud-gauge hud-gauge--stamina"
      role="meter"
      aria-label="Stamina"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="100"
    >
      <div class="hud-gauge-cavity">
        <div class="hud-gauge-fill hud-gauge-fill--stamina"></div>
        <svg class="hud-gauge-icon hud-gauge-icon--bolt" viewBox="0 0 40 40" aria-hidden="true">
          <polygon
            points="22,6 10,22 19,22 16.5,34 30,18 21,18"
            fill="#34e04b"
            stroke="#181c20"
            stroke-width="2.8"
            stroke-linejoin="round"
          />
          <polygon
            points="20.5,10 13.5,20 18.5,20"
            fill="#a7ffb0"
          />
        </svg>
      </div>
    </div>
  </section>

</div>
